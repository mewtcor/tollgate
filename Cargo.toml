[package]
name = "tollgate"
version = "0.1.0"
edition = "2021"
description = "Windows desktop app to pause, block, and schedule devices on an eero mesh Wi-Fi network"
authors = ["mewtcor"]
repository = "https://github.com/mewtcor/tollgate"
readme = "README.md"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time"] }
chrono = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
