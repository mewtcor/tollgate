[package]
name = "tollgate"
version = "0.1.1"
edition = "2021"
description = "Windows desktop app to pause, block, and schedule devices on an eero mesh Wi-Fi network"
authors = ["mewtcor"]
repository = "https://github.com/mewtcor/tollgate"
readme = "README.md"

[workspace]
members = ["crates/core", "crates/server"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tollgate-core = { path = "crates/core" }
serde_json = "1"

# applies to every crate in the workspace, including the server
[profile.release]
opt-level = "s"
lto = true
strip = true
