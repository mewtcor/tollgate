[package]
name = "tollgate-server"
version = "0.1.1"
edition = "2021"
description = "Headless Tollgate: runs eero timers and schedules around the clock and serves the UI over HTTP"
publish = false

[dependencies]
tollgate-core = { path = "../core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = "0.4"
